[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tushtan-egress"
version = "0.1.0"
description = "通过字符级与结构级特征识别沙箱内的出网限制的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tushtan" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tushtan.github.io"
Repository = "https://github.com/tushtan/egress"
Issues = "https://github.com/tushtan/egress/issues"

[project.scripts]
egress = "egress:main"

[tool.setuptools]
py-modules = ["egress"]
